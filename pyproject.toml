[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakes"
version = "0.1.0"
description = "Smart-contract analyzer recommendation and execution pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "py-solc-x>=1.1.1",
  "semantic-version>=2.8.5",
]

[dependency-groups]
dev = [
  "build",
  "pytest",
  "setuptools>=68",
  "wheel",
]

[project.scripts]
lakes = "toolrank.cli:main"
lakes-runner = "toolrank.runner:main"
lakes-profile-builder = "toolrank.profile_builder:main"
lakes-kb-update = "toolrank.kb_update:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["toolrank*", "toolcards*"]

[tool.setuptools.package-data]
toolrank = ["config/*.csv", "config/*.json"]
toolcards = ["*.json", "vector_index/*.json"]
